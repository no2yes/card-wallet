<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>실적맞춤카드지갑</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="카드지갑">
<meta name="theme-color" content="#0f1115">
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#1a1d21;--sub:#6b7280;--line:#e5e7eb;--pri:#2563eb;--priText:#fff;--ok:#16a34a;--warn:#dc2626;--bar:#e5e7eb}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#1a1d23;--text:#eef0f3;--sub:#9aa3af;--line:#2a2f37;--pri:#4f8cff;--priText:#0b1020;--ok:#4ade80;--warn:#f87171;--bar:#2a2f37}}
*{box-sizing:border-box}
html,body{overscroll-behavior-y:contain;overflow-x:hidden;max-width:100%;touch-action:pan-y}
html{-webkit-text-size-adjust:100%}
main,.card,.hero{max-width:100%;overflow-wrap:anywhere}
main{overflow-x:clip}
.card,.hero,.row,details,table,svg,img,input,select,textarea,button{max-width:100%}
input,select,textarea{min-width:0;font-size:16px}
pre,code{white-space:pre-wrap;overflow-wrap:anywhere}
#ptr{position:fixed;top:8px;left:50%;transform:translate(-50%,0);opacity:0;background:#111;color:#fff;padding:6px 14px;border-radius:16px;font-size:13px;z-index:15;pointer-events:none}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding-bottom:84px}
header{padding:18px 16px 6px;font-weight:700;font-size:18px}
main{padding:8px 16px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.hero{background:var(--pri);color:var(--priText);border-radius:16px;padding:18px;margin:10px 0}
.hero.done{background:var(--ok);color:#052e12}
.hero .lbl{opacity:.85;font-size:13px}.hero .big{font-size:28px;font-weight:800;margin:2px 0}.hero .sub{opacity:.9}
.row{display:flex;gap:8px;margin-top:10px}.row>*{flex:1}
button{font:inherit;border:0;border-radius:10px;padding:11px 12px;background:var(--pri);color:var(--priText);font-weight:600}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
button.sm{padding:6px 10px;font-size:13px}
button{-webkit-tap-highlight-color:transparent;transition:opacity .08s,transform .08s}
button:active{opacity:.55;transform:scale(.96)}
button.danger{background:transparent;color:var(--warn);border:1px solid var(--line)}
input,select,textarea{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);margin:4px 0 8px}
label{font-size:13px;color:var(--sub)}
.bar{height:8px;background:var(--bar);border-radius:6px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--pri)}
.bar.ok i{background:var(--ok)}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{font-size:12px;padding:2px 8px;border-radius:20px;background:var(--bar);color:var(--sub)}.badge.ok{background:var(--ok);color:#052e12}
.sub{color:var(--sub);font-size:13px}.neg{color:var(--warn)}
h3{margin:4px 0 8px;font-size:16px}h4{margin:14px 0 4px;font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:transparent;color:var(--sub);border-radius:0;padding:14px 0;font-size:13px}
nav button.on{color:var(--pri)}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);align-items:flex-end;z-index:10}
#modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-height:90vh;max-height:90dvh;display:flex;flex-direction:column;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.sbody{flex:1;overflow:auto;min-height:0;-webkit-overflow-scrolling:touch}
.row.sfoot{flex:0 0 auto;margin-top:10px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;display:none;z-index:20;max-width:90%}
.step{display:flex;gap:10px;margin:10px 0}.step>b{flex:0 0 24px;height:24px;border-radius:6px;background:var(--pri);color:var(--priText);text-align:center;line-height:24px;font-size:13px}
.step div b{background:var(--bar);border-radius:4px;padding:1px 5px;font-weight:700;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.step div{flex:1}
code{background:var(--bar);padding:1px 6px;border-radius:6px;font-size:13px;word-break:break-all}
.seg{display:flex;gap:6px}.seg button{background:var(--bar);color:var(--text)}.seg button.on{background:var(--pri);color:var(--priText)}
.tx{padding:9px 0;border-bottom:1px solid var(--line)}.tx:last-child{border:0}
.hero .sub,.hero .lbl{color:inherit}
.hero.lim{background:#b45309;color:#fff}
.gbar{position:relative;height:12px;background:var(--bar);border-radius:8px;margin:12px 0 24px}
.gbar i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:var(--pri)}
.gbar i.l1{background:var(--ok)}.gbar i.l2{background:#d4a017}
.gbar .tk{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text);opacity:.5}
.gbar .tl{position:absolute;top:16px;font-size:11px;color:var(--sub);transform:translateX(-50%);white-space:nowrap}
.gbar .tl.end{left:auto;right:0;transform:none}
details{margin-top:8px}summary{color:var(--pri);font-size:14px}
.bn{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0}.bn.on{border-color:var(--ok)}
.cinfo{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin:12px 0 10px}
.ci{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.ci small{display:block;color:var(--sub);font-size:12px}
.ci b{display:block;font-size:17px;margin-top:2px}
.pn{display:inline-block;background:var(--pri);color:var(--priText);font-weight:700;font-size:13px;border-radius:6px;padding:2px 8px;margin-right:8px}
.kw{display:inline-block;background:var(--bar);border-radius:4px;padding:2px 7px;margin:3px 5px 3px 0;font-size:13px;word-break:break-all}
</style>
</head>
<body>
<header>💳 실적맞춤카드지갑</header>
<main id="view"><div class="card sub">불러오는 중…</div></main>
<nav>
  <button data-t="home" onclick="go('home')">홈</button>
  <button data-t="hist" onclick="go('hist')">내역</button>
  <button data-t="cards" onclick="go('cards')">카드</button>
  <button data-t="set" onclick="go('set')">설정·안내</button>
</nav>
<div id="modal" onclick="if(event.target===this)closeModal()"></div>
<div id="toast"></div>
<div id="ptr"></div>

<script>
window.onerror = function (m, s, l) { var v = document.getElementById('view'); if (v) v.innerHTML = '<div class="card"><h3>오류가 났어요</h3><p class="sub">' + String(m) + ' (줄 ' + l + ')</p></div>'; };
window.addEventListener('unhandledrejection', function (e) { var v = document.getElementById('view'); if (v) v.innerHTML = '<div class="card"><h3>오류가 났어요</h3><p class="sub">' + String((e.reason && e.reason.message) || e.reason) + '</p></div>'; });
setTimeout(function () { var v = document.getElementById('view'); if (v && /불러오는 중/.test(v.textContent)) v.innerHTML = '<div class="card"><h3>응답이 없어요</h3><p class="sub">15초가 지나도 데이터가 오지 않았어요. 웹앱 주소와 Apps Script 배포를 확인하세요.</p></div>'; }, 15000);
</script>
<script>
var TOKEN = ''; try { TOKEN = localStorage.getItem('sjc_token') || ''; } catch (e) {}
var API_URL = 'https://script.google.com/macros/s/AKfycbxfK_E_CrpgGJT7Ab_jxAXKoSmhGvOVFhUuSOJl0X5jbfdYl-z_Qjm1xTMOvGqVl6jrCA/exec'; try { API_URL = localStorage.getItem('sjc_api') || API_URL; } catch (e) {}
var D = null, tab = 'home';
var platform = /android/i.test(navigator.userAgent) ? 'android' : 'ios';
var busy = false;

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function won(n) { return (Math.round(Number(n) || 0)).toLocaleString('ko-KR') + '원'; }
function toast(m) { var t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(function () { t.style.display = 'none'; }, 2600); }
function dLeft(n) { return n <= 1 ? '오늘 마감' : n + '일 남음'; }

function call(fn, args) {
  return new Promise(function (resolve, reject) {
    if (!API_URL) { reject(new Error('웹앱 주소가 없어요')); return; }
    fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ token: TOKEN, fn: fn, args: args || [] }) })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (j.ok) resolve(j.data); else reject(new Error(j.error || 'error')); })
      .catch(reject);
  });
}
function errMsg(e) { return String((e && e.message) || e || '').replace(/^Error:\s*/, ''); }

function load() {
  if (!TOKEN || !API_URL) return askToken();
  call('getDashboard').then(function (d) { D = d; render(); }).catch(function (e) {
    if (/unauthorized/.test(errMsg(e))) { TOKEN = ''; try { localStorage.removeItem('sjc_token'); } catch (x) {} askToken('토큰이 맞지 않습니다. 다시 입력하세요.'); }
    else { toast('불러오기 실패'); $('view').innerHTML = '<div class="card"><h3>불러오기 실패</h3><p class="sub">' + esc(errMsg(e)) + '</p><p class="sub">웹앱 주소와 Apps Script 배포를 확인하세요.</p><button onclick="load()">다시 시도</button></div>'; }
  });
}


function go(t) { tab = t; render(); window.scrollTo(0, 0); }

function render() {
  if (!D) return;
  document.querySelectorAll('nav button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-t') === tab); });
  $('view').innerHTML = tab === 'home' ? homeHTML() : tab === 'hist' ? histHTML() : tab === 'cards' ? cardsHTML() : setHTML();
  afterSet();
}

/* ---------- 홈 ---------- */

function cardOptions(sel, withBlank) {
  var o = withBlank ? '<option value="">카드 선택</option>' : '';
  D.cards.filter(function (c) { return c.active; }).forEach(function (c) { o += '<option value="' + esc(c.id) + '"' + (c.id === sel ? ' selected' : '') + '>' + esc(c.name) + '</option>'; });
  return o;
}

/* ---------- 모달 ---------- */
function modal(title, body, okText, onOk) {
  $('modal').innerHTML = '<div class="sheet"><h3>' + esc(title) + '</h3><div class="sbody">' + body + '</div><div class="row sfoot"><button class="ghost" onclick="closeModal()">취소</button><button id="mok">' + esc(okText) + '</button></div></div>';
  $('modal').classList.add('on');
  $('mok').dataset.t = okText;
  $('mok').onclick = function () {
    if (busy) { toast('처리 중이에요. 잠시만요'); return; }
    $('mok').textContent = '처리 중…';
    onOk();
  };
}
function closeModal() { $('modal').classList.remove('on'); $('modal').innerHTML = ''; }
function run(p, msg) {
  if (busy) return; busy = true; toast('처리 중…');
  p.then(function (r) { busy = false; closeModal(); toast(typeof msg === 'function' ? msg(r) : msg); load(); })
   .catch(function (e) { busy = false; var m = $('mok'); if (m && m.dataset.t) m.textContent = m.dataset.t; toast('실패: ' + errMsg(e)); });
}

function manualModal() {
  modal('결제 입력', '<label>카드</label><select id="m_card">' + cardOptions('', true) + '</select>' +
    '<label>금액(원)</label><input id="m_amt" type="number" inputmode="numeric" placeholder="예: 12300">' +
    '<label>가맹점(선택)</label><input id="m_mer" placeholder="예: 편의점">' +
    '<label><input id="m_can" type="checkbox" style="width:auto;margin-right:6px">승인 취소(환불)</label>',
    '저장', function () { run(call('addManual', [$('m_card').value, $('m_amt').value, $('m_mer').value, $('m_can').checked]), '저장했어요'); });
}

function adjustModal() {
  var first = D.status[0];
  modal('누적액 보정', '<p class="sub">카드사 앱에서 확인한 이번 집계 기간 이용액을 입력하면, 앱 누적액과의 차이만큼 보정 내역으로 기록돼요. 처음 시작할 때 현재 누적액을 넣는 용도로도 쓰세요.</p>' +
    '<label>카드</label><select id="a_card" onchange="adjHint()">' + cardOptions(first && first.id, false) + '</select>' +
    '<div class="sub" id="a_hint"></div>' +
    '<label>카드사 앱의 실제 이용액(원)</label><input id="a_amt" type="number" inputmode="numeric">',
    '보정', function () { run(call('adjust', [$('a_card').value, $('a_amt').value]), function (r) { return r.diff === 0 ? '차이가 없어요' : '보정 ' + (r.diff > 0 ? '+' : '') + won(r.diff); }); });
  adjHint();
}
function adjHint() {
  var s = D.status.filter(function (c) { return c.id === $('a_card').value; })[0];
  $('a_hint').textContent = s ? '현재 앱 누적액: ' + won(s.total) : '';
}

/* ---------- 내역 ---------- */
function histHTML() {
  var h = '';
  if (D.unassigned.length) {
    h += '<h3>미분류 결제</h3><div class="card">';
    D.unassigned.forEach(function (t) {
      h += '<div class="tx"><div class="between"><span>' + esc(t.when) + ' · ' + esc(t.merchant || '가맹점 불명') + '</span><b class="' + (t.amount < 0 ? 'neg' : '') + '">' + won(t.amount) + '</b></div>' +
        '<div class="row"><select onchange="assign(\'' + t.id + '\',this.value)">' + cardOptions('', true) + '</select><button class="danger sm" onclick="delTx(\'' + t.id + '\')">삭제</button></div></div>';
    });
    h += '</div>';
  }
  h += '<h3>최근 내역</h3><div class="card">';
  if (!D.recent.length) h += '<div class="sub">아직 내역이 없어요.</div>';
  D.recent.forEach(function (t) {
    h += '<div class="tx"><div class="between"><span>' + esc(t.when) + ' · ' + esc(t.cardName || '미분류') + '</span><b class="' + (t.amount < 0 ? 'neg' : '') + '">' + won(t.amount) + '</b></div>' +
      '<div class="between sub"><span>' + esc(t.merchant) + ' <span class="badge">' + esc(t.source) + (t.counted ? '' : ' · 실적 제외') + '</span></span><button class="danger sm" onclick="delTx(\'' + t.id + '\')">삭제</button></div></div>';
  });
  return h + '</div>';
}
function assign(id, cardId) { if (cardId) run(call('assignTx', [id, cardId]), '지정했어요'); }
function delTx(id) { if (confirm('이 내역을 삭제할까요?')) run(call('deleteTx', [id]), '삭제했어요'); }

/* ---------- 카드 ---------- */

/* ---------- 설정·안내 ---------- */
function setHTML() {
  var s = D.settings, h = '';
  h += '<h3>알림</h3><div class="card"><label>알림 방식</label><select id="s_mode" onchange="modeChange()">' +
    '<option value="bark"' + (s.notify === 'bark' ? ' selected' : '') + '>Bark (아이폰)</option>' +
    '<option value="ntfy"' + (s.notify === 'ntfy' ? ' selected' : '') + '>ntfy (안드로이드)</option>' +
    '<option value="none"' + (s.notify === 'none' ? ' selected' : '') + '>알림 끄기</option></select>' +
    '<div id="s_bark"><label>Bark 주소 ' + (s.hasBark ? '(설정됨 · 바꾸려면 새로 입력)' : '') + '</label><input id="s_barkKey" placeholder="Bark 앱에 표시된 주소 붙여넣기"></div>' +
    '<div id="s_ntfy"><label>ntfy 주제 이름 ' + (s.hasNtfy ? '(설정됨 · 바꾸려면 새로 입력)' : '') + '</label><input id="s_ntfyTopic" placeholder="길고 추측하기 어려운 이름 (예: wallet-8f3k29xq)"></div>' +
    '<label>마감 임박 카드 먼저 추천</label><select id="s_urgent">' + [0, 2, 3, 5, 7].map(function (d) { return '<option value="' + d + '"' + (s.urgentDays === d ? ' selected' : '') + '>' + (d ? '마감 ' + d + '일 전부터 우선' : '사용 안 함 (설정한 우선순위만)') + '</option>'; }).join('') + '</select>' +
    '<div class="row"><button onclick="saveSettings()">저장</button><button class="ghost" onclick="testPush()">알림 테스트</button></div></div>';

  h += '<h3>문자 인식 테스트</h3><div class="card"><p class="sub">카드 승인 문자를 붙여넣으면 어떻게 읽히는지 확인해요. 저장되지 않아요. 카드번호·이름은 가려서 붙여넣으세요.</p><textarea id="p_text" rows="4" placeholder="문자 내용 붙여넣기"></textarea><button onclick="testParse()">확인</button><div id="p_res" class="sub" style="margin-top:8px"></div></div>';

  h += '<h3>폰 자동 연결 안내</h3><div class="card"><div class="seg"><button class="' + (platform === 'ios' ? 'on' : '') + '" onclick="setPlat(\'ios\')">아이폰</button><button class="' + (platform === 'android' ? 'on' : '') + '" onclick="setPlat(\'android\')">안드로이드</button></div>' + guideHTML() + '</div>';

  h += quickGuideHTML();
  h += '<h3>보안</h3><div class="card"><p class="sub">토큰은 이 앱과 폰 자동화가 서로를 확인하는 비밀번호예요. 유출이 의심되면 재발급하고, 폰 자동화의 토큰도 새 값으로 바꾸세요.</p>' +
    '<div class="row"><button class="ghost" onclick="copyToken()">토큰 복사</button><button class="danger" onclick="rotate()">토큰 재발급</button></div></div>';
  return h;
}
function modeChange() { var m = $('s_mode').value; $('s_bark').style.display = m === 'bark' ? '' : 'none'; $('s_ntfy').style.display = m === 'ntfy' ? '' : 'none'; }
function afterSet() {
  if ($('s_mode')) modeChange();
  if (tab === 'home' && D && D.status && D.status.length) fadeSetup();
}

// 홈 아래쪽(할인 한도·카드 실적)은 처음엔 흐리게, 화면을 내릴수록 서서히 또렷해짐
function fadeUpdate() {
  var els = document.querySelectorAll('.fade');
  if (!els.length) return;
  var scrollable = document.documentElement.scrollHeight > window.innerHeight + 40;
  var y = window.pageYOffset || document.documentElement.scrollTop || 0;
  var p = scrollable ? Math.min(1, Math.max(0, y / 140)) : 1;
  var o = 0.12 + 0.88 * p, b = (1 - p) * 3;
  for (var i = 0; i < els.length; i++) {
    els[i].style.opacity = o;
    els[i].style.pointerEvents = p < 0.6 ? 'none' : 'auto';
    els[i].style.filter = b > 0.05 ? 'blur(' + b.toFixed(1) + 'px)' : 'none';
  }
}
function fadeSetup() {
  document.querySelectorAll('#view > h4, #view > .card:not([onclick])').forEach(function (e) {
    e.classList.add('fade');
    e.style.transition = 'opacity .15s linear, filter .15s linear';
  });
  fadeUpdate();
}
window.addEventListener('scroll', fadeUpdate, { passive: true });


function saveSettings() { run(call('saveSettings', [{ notify: $('s_mode').value, barkKey: $('s_barkKey').value, ntfyTopic: $('s_ntfyTopic').value, urgentDays: $('s_urgent').value }]), '저장했어요'); }
function testPush() {
  toast('알림 보내는 중…');
  call('saveSettings', [{ notify: $('s_mode').value, barkKey: $('s_barkKey').value, ntfyTopic: $('s_ntfyTopic').value, urgentDays: $('s_urgent').value }])
    .then(function () { return call('testPush'); })
    .then(function (ok) { toast(ok ? '알림을 보냈어요. 폰을 확인하세요' : '알림 전송 실패: 주소·주제를 확인하세요'); })
    .catch(function (e) { toast('실패: ' + errMsg(e)); });
}
function testParse() {
  toast('확인 중…');
  call('testParse', [$('p_text').value]).then(function (r) {
    $('p_res').innerHTML = !r.ok ? '<span class="neg">' + esc(r.error) + '</span>' :

/* ===== 추가: 게이지 홈 · 단계/할인 한도 입력 ===== */
function man(n) { n = Math.round(Number(n) || 0); return n >= 10000 ? (Math.round(n / 1000) / 10) + '만' : n.toLocaleString('ko-KR'); }
function nl2br(s) { return esc(s).replace(/\n/g, '<br>'); }

// 반원 게이지 (홈 맨 위 추천 카드용). 눈금 = 1단계 위치
function gaugeSVG(total, t1, t2) {
  var max = t2 > 0 ? t2 : t1;
  var L = Math.PI * 90, f = max > 0 ? Math.min(1, total / max) : 0;
  var arc = 'M10 100 A90 90 0 0 1 190 100';
  var h = '<svg viewBox="0 0 200 112" style="width:100%;max-width:260px;display:block;margin:4px auto 0"><path d="' + arc + '" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="14" stroke-linecap="round"/>';
  if (f > 0) h += '<path d="' + arc + '" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round" stroke-dasharray="' + (f * L).toFixed(1) + ' ' + L.toFixed(1) + '"/>';
  if (t2 > 0 && t1 > 0 && t1 < max) {
    var a = Math.PI * (1 - t1 / max), c = Math.cos(a), s = Math.sin(a);
    h += '<line x1="' + (100 + 78 * c).toFixed(1) + '" y1="' + (100 - 78 * s).toFixed(1) + '" x2="' + (100 + 102 * c).toFixed(1) + '" y2="' + (100 - 102 * s).toFixed(1) + '" stroke="rgba(0,0,0,.55)" stroke-width="3"/>';
    h += '<text x="' + (100 + 64 * c).toFixed(1) + '" y="' + (100 - 64 * s + 4).toFixed(1) + '" font-size="10" text-anchor="middle" fill="currentColor" opacity=".85">' + man(t1) + '</text>';
  }
  h += '<text x="100" y="88" font-size="24" font-weight="800" text-anchor="middle" fill="currentColor">' + man(total) + '</text>';
  h += '<text x="100" y="106" font-size="11" text-anchor="middle" fill="currentColor" opacity=".85">/ ' + man(max) + '원</text></svg>';
  return h;
}

// 가로 막대 게이지. 카드: 1단계 눈금 / 할인 한도: 80% 눈금
function gbar(total, t1, t2, kind) {
  var max = t2 > 0 ? t2 : t1;
  if (!(max > 0)) return '';
  var pct = Math.max(0, Math.min(100, total / max * 100));
  var cls = '';
  if (kind === 'limit') cls = total >= t1 * 0.8 ? 'l2' : '';
  else cls = (t2 > 0 && total >= t2) ? 'l2' : (total >= t1 ? 'l1' : '');
  var h = '<div class="gbar"><i class="' + cls + '" style="width:' + pct + '%"></i>';
  if (kind === 'limit') h += '<span class="tk" style="left:80%"></span><span class="tl" style="left:80%">80%</span>';
  else if (t2 > 0 && t1 > 0) h += '<span class="tk" style="left:' + (t1 / max * 100) + '%"></span><span class="tl" style="left:' + (t1 / max * 100) + '%">' + man(t1) + '</span>';
  return h + '<span class="tl end">' + man(max) + '</span></div>';
}

function benefitHTML(c) {
  if (!c.benefit1 && !c.benefit2) return '';
  function blk(title, txt, on) {
    return '<div class="bn' + (on ? ' on' : '') + '"><b>' + title + (on ? ' · 이번 기간 적용 중' : '') + '</b><div class="sub">' + nl2br(txt) + '</div></div>';
  }
  return '<details><summary>혜택 보기</summary>' +
    (c.benefit1 ? blk('1단계 (' + man(c.target) + '원 이상)', c.benefit1, c.prevLevel >= 1) : '') +
    (c.benefit2 ? blk('2단계 (' + man(c.target2) + '원 이상)', c.benefit2, c.prevLevel >= 2) : '') + '</details>';
}

function periodLine(c) {
  return '<div class="sub">집계 ' + c.periodStart.slice(5).replace('-', '.') + ' ~ ' + c.periodEnd.slice(5).replace('-', '.') + ' · ' + dLeft(c.daysLeft) + '</div>';
}

function cardRow(c) {
  var goal = c.target2 > 0 ? c.target2 : c.target;
  var pct = goal ? Math.min(100, Math.round(c.total / goal * 100)) : 0;
  var badge = c.level === 2 ? '2단계 달성' : c.level === 1 ? (c.target2 > 0 ? '1단계 달성' : '달성') : '진행 중';
  var next = (c.target > 0 && !c.achieved) ? '1단계까지 ' + won(c.remaining) + ' 남음' : (c.target2 > 0 && !c.achieved2 ? '2단계까지 ' + won(c.remaining2) + ' 남음' : '모든 단계 달성 🎉');
  var apply = c.target > 0 ? '<div class="sub">이번 기간 적용 혜택: <b>' + (c.prevLevel ? c.prevLevel + '단계' : '없음') + '</b> (지난 기간 실적 ' + won(c.prevTotal) + ')</div>' : '';
  return '<div class="card"><div class="between"><b>' + esc(c.name) + '</b><span class="badge ' + (c.level ? 'ok' : '') + '">' + badge + '</span></div>' +
    gbar(c.total, c.target, c.target2, 'card') +
    '<div class="between sub"><span>' + won(c.total) + ' / ' + won(goal) + '</span><span>' + pct + '%</span></div>' +
    '<div>' + next + '</div>' + apply + periodLine(c) + benefitHTML(c) + '</div>';
}

function limitRow(c) {
  var pct = c.target ? Math.min(100, Math.round(c.total / c.target * 100)) : 0;
  return '<div class="card"><div class="between"><b>' + esc(c.name) + '</b><span class="badge ' + (c.achieved ? '' : 'ok') + '">' + (c.achieved ? '한도 소진' : '할인 ' + c.benefitRate + '%') + '</span></div>' +

    '<div>남은 한도 <b>' + won(c.remaining) + '</b> · 남은 할인 약 <b>' + won(c.remainDiscount) + '</b></div>' + periodLine(c) +

}

/* ===== 추가: 카드 탭 시인성 개선 ===== */
function cardsHTML() {
  var h = '<div class="between"><h3>등록한 카드</h3><button class="sm" onclick="cardModal()">+ 카드 추가</button></div>';
  if (!D.cards.length) h += '<div class="card sub">등록된 카드가 없어요.</div>';
  function tile(label, val) { return '<div class="ci"><small>' + label + '</small><b>' + val + '</b></div>'; }
  function m(n) { n = Math.round(Number(n) || 0); return n >= 10000 ? (Math.round(n / 1000) / 10) + '만원' : n.toLocaleString('ko-KR') + '원'; }
  function kws(s) {
    var a = String(s || '').split(',').map(function (x) { return x.trim(); }).filter(function (x) { return x; });
    return a.length ? a.map(function (k) { return '<span class="kw">' + esc(k) + '</span>'; }).join('') : '<span class="sub">없음</span>';
  }
  D.cards.slice().sort(function (a, b) { return a.priority - b.priority; }).forEach(function (c) {
    var lim = c.kind === 'limit';
    var tiles = lim ? tile('월 사용 한도', m(c.target)) + tile('할인율', c.benefitRate + '%')
                    : tile('1단계 실적', m(c.target)) + (c.target2 ? tile('2단계 실적', m(c.target2)) : '');
    tiles += tile('집계 시작일', '매월 ' + c.startDay + '일');
    h += '<div class="card"><div class="between"><span><span class="pn">' + c.priority + '순위</span><b>' + esc(c.name) + '</b>' +
      (lim ? ' <span class="badge">할인 한도형</span>' : '') + (c.active ? '' : ' <span class="badge">사용 중지</span>') + '</span>' +
      '<button class="ghost sm" onclick="cardModal(\'' + c.id + '\')">수정</button></div>' +
      '<div class="cinfo">' + tiles + '</div>' +
      '<div class="sub">문자 인식 키워드</div><div>' + kws(c.keywords) + '</div>' +
      (c.excludeKeywords ? '<div class="sub" style="margin-top:6px">실적 제외 키워드</div><div>' + kws(c.excludeKeywords) + '</div>' : '') + '</div>';
  });
  return h;
}

/* ===== 당겨서 새로고침 ===== */
(function () {
  var ptr = $('ptr'), sy = 0, dy = 0, pulling = false, TH = 70;
  function top() { return (window.pageYOffset || document.documentElement.scrollTop || 0) <= 0 && !$('modal').classList.contains('on'); }
  function reset() { ptr.style.opacity = 0; ptr.style.transform = 'translate(-50%,0)'; }
  document.addEventListener('touchstart', function (e) { if (top() && e.touches.length === 1) { sy = e.touches[0].clientY; dy = 0; pulling = true; } else pulling = false; }, { passive: true });
  document.addEventListener('touchmove', function (e) {
    if (!pulling) return;
    dy = e.touches[0].clientY - sy;
    if (dy > 0 && top()) { ptr.textContent = dy > TH ? '놓으면 새로고침' : '↓ 당겨서 새로고침'; ptr.style.opacity = Math.min(1, dy / TH); ptr.style.transform = 'translate(-50%,' + Math.min(dy / 2, 50) + 'px)'; } else reset();
  }, { passive: true });
  document.addEventListener('touchend', function () { if (pulling && dy > TH) { toast('새로고침 중…'); load(); } reset(); pulling = false; });
})();

/* ===== 연결 화면 / 시작 ===== */
function askToken(msg) {
  $('view').innerHTML = '<div class="card"><h3>처음 연결</h3><p class="sub">' + esc(msg || '처음 한 번만 입력하면 이 기기에 저장돼요. 보통은 Tony가 보내준 링크로 열면 자동으로 채워져요.') + '</p>' +
    '<label>Apps Script 웹앱 주소</label><input id="au" value="' + esc(API_URL) + '" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">' +
    '<label>접속 토큰</label><input id="tk" type="password" placeholder="토큰 붙여넣기" autocomplete="off"><button onclick="saveToken()">확인</button></div>';
}
function saveToken() {
  API_URL = ($('au').value || '').trim(); TOKEN = $('tk').value.trim();
  try { localStorage.setItem('sjc_api', API_URL); localStorage.setItem('sjc_token', TOKEN); } catch (e) {}
  load();
}
(function () {
  var hs = location.hash || '';
  var mt = hs.match(/[#&]t=([^&]+)/), mu = hs.match(/[#&]u=([^&]+)/);
  if (mt) TOKEN = decodeURIComponent(mt[1]);
  if (mu) API_URL = decodeURIComponent(mu[1]);
  try { if (mt) localStorage.setItem('sjc_token', TOKEN); if (mu) localStorage.setItem('sjc_api', API_URL); } catch (e) {}
  load();
})();
</script>
</body>
</html>
