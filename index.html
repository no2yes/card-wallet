<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">

<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#1a1d21;--sub:#6b7280;--line:#e5e7eb;--pri:#2563eb;--priText:#fff;--ok:#16a34a;--warn:#dc2626;--bar:#e5e7eb}

*{box-sizing:border-box}
html,body{overscroll-behavior-y:contain;overflow-x:hidden;max-width:100%;touch-action:pan-y}
html{-webkit-text-size-adjust:100%}
main,.card,.hero{max-width:100%;overflow-wrap:anywhere}
main{overflow-x:clip}
.card,.hero,.row,details,table,svg,img,input,select,textarea,button{max-width:100%}
input,select,textarea{min-width:0;font-size:16px}
pre,code{white-space:pre-wrap;overflow-wrap:anywhere}
#ptr{position:fixed;top:8px;left:50%;transform:translate(-50%,0);opacity:0;background:#111;color:#fff;padding:6px 14px;border-radius:16px;font-size:13px;z-index:15;pointer-events:none}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding-bottom:84px}
header{padding:18px 16px 6px;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:space-between;gap:8px}
#hhsw .hhseg{display:flex;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}#hhsw .hhseg button{width:auto;min-height:0;height:auto;line-height:21px;margin:0;border:0;border-radius:0;background:transparent;color:var(--text);font-size:14px;font-weight:600;padding:5px 11px}#hhsw .hhseg button.on{background:var(--pri);color:var(--priText)}
#hhsw select,#hhsw span{font-size:14px;font-weight:600;padding:5px 10px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);width:auto;margin:0}
main{padding:8px 16px;max-width:560px;margin:0 auto}
.acts{display:flex;align-items:center;gap:6px;flex-shrink:0;margin-left:8px}
.acts button{height:28px;min-height:0;padding:0 10px;margin:0;font-size:13px;width:auto}

.grip{display:inline-block;padding:6px 10px 6px 2px;margin-right:2px;font-size:20px;line-height:1;color:var(--sub);cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ccard{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:scale .15s,box-shadow .15s}
.ccard.lift{position:relative;z-index:6;scale:.97;box-shadow:0 12px 28px rgba(0,0,0,.30)}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}

.row{display:flex;gap:8px;margin-top:10px}.row>*{flex:1}
button{font:inherit;border:0;border-radius:10px;padding:11px 12px;background:var(--pri);color:var(--priText);font-weight:600}

label{font-size:13px;color:var(--sub)}

.between{display:flex;justify-content:space-between;align-items:center;gap:8px}

h3{margin:4px 0 8px;font-size:16px}

.lgm{margin-bottom:10px}.lgm b{font-size:17px}.lgm button:disabled{opacity:.3}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.chips button{padding:5px 11px;font-size:13px;border-radius:16px;background:var(--bar);color:var(--text)}.chips button.on{background:var(--pri);color:var(--priText)}

.lgi{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}.lgi:first-of-type{border-top:0}
.lgi .l{min-width:0}.lgi .l b{display:block;font-size:14px;overflow-wrap:anywhere}.lgi .r{text-align:right;white-space:nowrap}.lgi.skip{opacity:.5}
#letter{position:fixed;inset:0;z-index:100;background:#000;color:#f2efe8;opacity:0;transition:opacity 1s ease}
#letter.on{opacity:1}
.lt-bg{position:absolute;inset:0;background:url(letter-bg.jpg) center/cover no-repeat;opacity:0;transition:opacity 2.5s ease 0.3s;pointer-events:none}
#letter.on .lt-bg{opacity:.36}
.lt-hearts{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.lt-h{position:absolute;bottom:-60px;animation:ltRise linear forwards;will-change:transform,opacity}
.lt-h svg{display:block;width:100%;height:100%;fill:currentColor;animation:ltDance ease-in-out infinite;filter:drop-shadow(0 0 6px currentColor)}
.lt-em{left:0;right:0;display:flex;justify-content:center;bottom:-90px;width:auto!important;height:auto!important}
.lt-em .in{display:flex;align-items:center;gap:10px;animation:ltSway 3.6s ease-in-out infinite}
.lt-em{animation-name:ltRiseSoft}
.lt-em b{font:700 50px/1 "Noto Serif KR","Nanum Myeongjo","Apple SD Gothic Neo",serif;letter-spacing:.04em;background:linear-gradient(180deg,#ffe3ea,#ff5c85);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 8px rgba(255,92,133,.55))}
.lt-em svg{width:44px;height:44px;fill:#ff3b6b;filter:drop-shadow(0 0 8px #ff3b6b);animation:ltBeat 1.1s ease-in-out infinite}
@keyframes ltSway{0%,100%{transform:translateX(-22px) rotate(-4deg)}50%{transform:translateX(22px) rotate(4deg)}}
@keyframes ltBeat{0%,100%{transform:scale(.9)}25%{transform:scale(1.25)}45%{transform:scale(1)}}
@keyframes ltRiseSoft{0%{transform:translate3d(0,0,0);opacity:0}12%{opacity:.34}85%{opacity:.3}100%{transform:translate3d(0,-125vh,0);opacity:0}}
@keyframes ltRise{0%{transform:translate3d(0,0,0);opacity:0}10%{opacity:.6}80%{opacity:.5}100%{transform:translate3d(0,-120vh,0);opacity:0}}
@keyframes ltDance{0%,100%{transform:translateX(-16px) rotate(-16deg) scale(.88)}50%{transform:translateX(16px) rotate(16deg) scale(1.12)}}
.lt-stage{position:absolute;left:0;right:0;top:0;bottom:calc(84px + env(safe-area-inset-bottom));overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 16%,#000 78%,transparent);mask-image:linear-gradient(transparent,#000 16%,#000 78%,transparent)}
.lt-in{position:absolute;left:0;right:0;top:0;padding:0 30px;text-align:center;will-change:transform;transform:translateY(30vh)}
.lt-in p{margin:0 0 10px;font-size:19px;line-height:1.75;font-family:"Noto Serif KR","Nanum Myeongjo","Apple SD Gothic Neo",serif;letter-spacing:.01em}
.lt-in .gap{height:30px;margin:0}
.lt-title{font-size:27px;line-height:1.5;margin-bottom:40px;font-family:"Noto Serif KR","Nanum Myeongjo","Apple SD Gothic Neo",serif}
.lt-end{margin-top:110px}.lt-end p{font-size:20px}.lt-end .big{font-size:24px;margin-top:26px}
.lt-bar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:10px;justify-content:center;align-items:center;height:84px;box-sizing:border-box;padding:0 16px env(safe-area-inset-bottom);background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.55))}
.lt-bar button{background:transparent;color:#888;border:1px solid #333;font-size:13px;padding:8px 16px;border-radius:18px;margin:0}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);align-items:flex-end;z-index:10}
#modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-height:90vh;max-height:90dvh;display:flex;flex-direction:column;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.sbody{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
.sheet{overflow:hidden;touch-action:pan-y}#modal{overscroll-behavior:contain;touch-action:pan-y}
.sbody input[type=date],.sbody input[type=month]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;max-width:100%;box-sizing:border-box;min-height:44px;text-align:left}
.sbody input[type=date]::-webkit-date-and-time-value,.sbody input[type=month]::-webkit-date-and-time-value{text-align:left;min-width:0}
.row.sfoot{flex:0 0 auto;margin-top:10px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;display:none;z-index:20;max-width:90%}
.step{display:flex;gap:10px;margin:10px 0}.step>b{flex:0 0 24px;height:24px;border-radius:6px;background:var(--pri);color:var(--priText);text-align:center;line-height:24px;font-size:13px}
.step div b{background:var(--bar);border-radius:4px;padding:1px 5px;font-weight:700;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.step div{flex:1}
code{background:var(--bar);padding:1px 6px;border-radius:6px;font-size:13px;word-break:break-all}
.seg{display:flex;gap:6px}.seg button{background:var(--bar);color:var(--text)}.seg button.on{background:var(--pri);color:var(--priText)}
.tx{padding:9px 0;border-bottom:1px solid var(--line)}.tx:last-child{border:0}
.hero .sub,.hero .lbl{color:inherit}
.hero.lim{background:#b45309;color:#fff}
.gbar{position:relative;height:12px;background:var(--bar);border-radius:8px;margin:12px 0 24px}
.gbar i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:var(--pri)}
.gbar i.l1{background:var(--ok)}.gbar i.l2{background:#d4a017}
.gbar .tk{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text);opacity:.5}
.gbar .tl{position:absolute;top:16px;font-size:11px;color:var(--sub);transform:translateX(-50%);white-space:nowrap}
.gbar .tl.end{left:auto;right:0;transform:none}
details{margin-top:8px}summary{color:var(--pri);font-size:14px}
.bn{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0}.bn.on{border-color:var(--ok)}
.cinfo{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin:12px 0 10px}
.ci{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.ci small{display:block;color:var(--sub);font-size:12px}
.ci b{display:block;font-size:17px;margin-top:2px}
.pn{display:inline-block;background:var(--pri);color:var(--priText);font-weight:700;font-size:13px;border-radius:6px;padding:2px 8px;margin-right:8px}
.kw{display:inline-block;background:var(--bar);border-radius:4px;padding:2px 7px;margin:3px 5px 3px 0;font-size:13px;word-break:break-all}
.lrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid rgba(255,255,255,.3)}.lrow:first-of-type{border-top:0}
.lrow .nm{font-weight:700}.lrow .rm{text-align:right}.lrow.off{opacity:.6}
body.easy{font-size:20px;line-height:1.55}
body.easy nav button[data-t=cards]{display:none}
body.easy nav button{font-size:18px;padding:18px 0;font-weight:700}
body.easy .card{padding:18px;border-radius:18px}
body.easy button{font-size:20px;padding:16px 18px;min-height:56px;border-radius:14px}
body.easy .hero{padding:24px 20px;border-radius:20px}
body.easy .hero .lbl{font-size:18px;font-weight:700}
body.easy .hero .big{font-size:38px;line-height:1.25;margin:6px 0}
body.easy .hero .sub{font-size:20px}
body.easy .lrow{font-size:20px;padding:12px 0;flex-direction:column;gap:2px}

body.easy h4{font-size:20px;margin:22px 0 6px}

body.easy .lgac{flex-wrap:wrap;gap:2px 8px;padding:10px 0}body.easy .lgan{font-size:17px;color:var(--sub)}body.easy .lgab{display:flex;align-items:center;gap:8px;margin-left:auto}
body.easy .lgbal{font-size:30px;line-height:1.1;white-space:nowrap}body.easy button.lgmg{font-size:13px;padding:3px 9px;min-height:0;height:auto;border-radius:9px}
body.easy .lgi .l b,body.easy .lgi .r b{font-size:19px}body.easy .lgi .sub,body.easy .lgd,body.easy .badge{font-size:16px}body.easy .lgc{font-size:19px}
body.easy .chips button{font-size:17px;padding:10px 14px;min-height:0}body.easy .lgm b{font-size:22px}body.easy .lgm button,body.easy .sm{min-height:48px}body.easy .between .sub{font-size:16px}

body.easy input,body.easy select,body.easy textarea{font-size:20px;padding:14px}
</style>

<body>
<header><span>💳 실적맞춤카드지갑</span><span id="hhsw"></span></header>
<main id="view"><div class="card sub">불러오는 중…</div></main>
<nav>
  <button data-t="home" onclick="go('home')">홈</button>
  <button data-t="hist" onclick="go('hist')">내역</button>
  <button data-t="cards" onclick="go('cards')">카드</button>
  <button data-t="ledger" onclick="go('ledger')">가계부</button>
  <button data-t="set" onclick="go('set')">설정·안내</button>
</nav>
<div id="modal" onclick="if(event.target===this)closeModal()"></div>
<div id="toast"></div>
<div id="ptr"></div>

<script>
window.onerror = function (m, s, l) { var v = document.getElementById('view'); if (v) v.innerHTML = '<div class="card"><h3>오류가 났어요</h3><p class="sub">' + String(m) + ' (줄 ' + l + ')</p></div>'; };
window.addEventListener('unhandledrejection', function (e) { var v = document.getElementById('view'); if (v) v.innerHTML = '<div class="card"><h3>오류가 났어요</h3><p class="sub">' + String((e.reason && e.reason.message) || e.reason) + '</p></div>'; });
setTimeout(function () { var v = document.getElementById('view'); if (v && /불러오는 중/.test(v.textContent)) v.innerHTML = '<div class="card"><h3>응답이 없어요</h3><p class="sub">15초가 지나도 데이터가 오지 않았어요. 웹앱 주소와 Apps Script 배포를 확인하세요.</p></div>'; }, 15000);
</script>
<script>
var HHSEL = ''; try { HHSEL = localStorage.getItem('sjc_hh') || ''; } catch (e) {}
var SESSION = ''; try { SESSION = localStorage.getItem('sjc_sess') || ''; } catch (e) {}
var IS_MOBILE = /iPhone|iPad|iPod|Android|Mobile/i.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
var API_URL = 'https://script.google.com/macros/s/AKfycbxfK_E_CrpgGJT7Ab_jxAXKoSmhGvOVFhUuSOJl0X5jbfdYl-z_Qjm1xTMOvGqVl6jrCA/exec'; try { API_URL = localStorage.getItem('sjc_api') || API_URL; } catch (e) {}
var D = null, tab = 'home';
var platform = /android/i.test(navigator.userAgent) ? 'android' : 'ios';
var busy = false;

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function won(n) { return (Math.round(Number(n) || 0)).toLocaleString('ko-KR') + '원'; }
function toast(m) { var t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(function () { t.style.display = 'none'; }, 2600); }
function dLeft(n) { return n <= 1 ? '오늘 마감' : n + '일 남음'; }

var LETTER = null, LETTER_TRIED = false, LT_PAUSED = false;
function letterOff() { try { return localStorage.getItem('sjc_letter_off') === LETTER.today; } catch (e) { return false; } }
function getLetterOnce() {
  if (LETTER_TRIED) return; LETTER_TRIED = true;
  call('getLetter', [D && D.admin ? 'preview' : '']).then(function (L) {
    LETTER = L;
    if (L && L.show) { if (L.auto && !letterOff()) showLetter(true); render(); }
  }).catch(function () {});
}
function letterBtn() {
  if (!LETTER || !LETTER.show) return '';
  return '<div class="card"><h3>💌 편지</h3><button onclick="showLetter()">' + (LETTER.preview ? '편지 미리보기' : '편지 다시 보기') + '</button></div>';
}
function showLetter(isAuto) {
  if (!LETTER || !LETTER.show || $('letter')) return;
  var notify = isAuto === true && !LETTER.preview, doneSent = false;
  if (notify) call('letterEvent', ['open']).catch(function () {});
  var h = '<div class="lt-in" id="lt_in"><div class="lt-title">' + esc(LETTER.title) + '</div>';
  LETTER.lines.forEach(function (l) { h += l ? '<p>' + esc(l) + '</p>' : '<p class="gap"></p>'; });
  h += '<div class="lt-end" id="lt_end">' + LETTER.outro.map(function (l, i) { return '<p' + (i === LETTER.outro.length - 1 ? ' class="big"' : '') + '>' + esc(l) + '</p>'; }).join('') + '</div></div>';
  var el = document.createElement('div'); el.id = 'letter';
  el.innerHTML = '<div class="lt-bg"></div><div class="lt-hearts" id="lt_hearts"></div><div class="lt-stage" id="lt_stage">' + h + '</div><div class="lt-bar"><button onclick="closeLetter()">닫기</button><button onclick="closeLetter(true)">오늘은 다시 보지 않기</button></div>';
  document.body.appendChild(el); document.body.style.overflow = 'hidden';
  startHearts();
  requestAnimationFrame(function () { el.classList.add('on'); });
  el.addEventListener('touchstart', function (e) { if (e.target.tagName !== 'BUTTON') LT_PAUSED = true; }, { passive: true });
  el.addEventListener('touchend', function () { LT_PAUSED = false; }, { passive: true });
  el.addEventListener('touchcancel', function () { LT_PAUSED = false; }, { passive: true });
  var stage = $('lt_stage'), inn = $('lt_in'), endEl = $('lt_end');
  var vh = stage.clientHeight, y = Math.round(vh * 0.30);

function fadeUpdate() {
  var els = document.querySelectorAll('.fade');
  if (!els.length) return;
  var scrollable = document.documentElement.scrollHeight > window.innerHeight + 40;
  var y = window.pageYOffset || document.documentElement.scrollTop || 0;
  var p = scrollable ? Math.min(1, Math.max(0, y / 140)) : 1;
  var o = 0.12 + 0.88 * p, b = (1 - p) * 3;
  for (var i = 0; i < els.length; i++) {
    els[i].style.opacity = o;
    els[i].style.pointerEvents = p < 0.6 ? 'none' : 'auto';
    els[i].style.filter = b > 0.05 ? 'blur(' + b.toFixed(1) + 'px)' : 'none';
  }
}
function fadeSetup() {
  document.querySelectorAll('#view > h4, #view > .card:not([onclick])').forEach(function (e) {
    e.classList.add('fade');
    e.style.transition = 'opacity .15s linear, filter .15s linear';
  });
  fadeUpdate();
}
window.addEventListener('scroll', fadeUpdate, { passive: true });

  var max = t2 > 0 ? t2 : t1;
  var L = Math.PI * 90, f = max > 0 ? Math.min(1, total / max) : 0;
  var arc = 'M10 100 A90 90 0 0 1 190 100';
  var h = '<svg viewBox="0 0 200 112" style="width:100%;max-width:260px;display:block;margin:4px auto 0"><path d="' + arc + '" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="14" stroke-linecap="round"/>';
  if (f > 0) h += '<path d="' + arc + '" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round" stroke-dasharray="' + (f * L).toFixed(1) + ' ' + L.toFixed(1) + '"/>';
  if (t2 > 0 && t1 > 0 && t1 < max) {
    var a = Math.PI * (1 - t1 / max), c = Math.cos(a), s = Math.sin(a);
    h += '<line x1="' + (100 + 78 * c).toFixed(1) + '" y1="' + (100 - 78 * s).toFixed(1) + '" x2="' + (100 + 102 * c).toFixed(1) + '" y2="' + (100 - 102 * s).toFixed(1) + '" stroke="rgba(0,0,0,.55)" stroke-width="3"/>';
    h += '<text x="' + (100 + 64 * c).toFixed(1) + '" y="' + (100 - 64 * s + 4).toFixed(1) + '" font-size="10" text-anchor="middle" fill="currentColor" opacity=".85">' + man(t1) + '</text>';
  }
  h += '<text x="100" y="88" font-size="24" font-weight="800" text-anchor="middle" fill="currentColor">' + man(total) + '</text>';
  h += '<text x="100" y="106" font-size="11" text-anchor="middle" fill="currentColor" opacity=".85">/ ' + man(max) + '원</text></svg>';
  return h;
}

// 가로 막대 게이지. 카드: 1단계 눈금 / 할인 한도: 80% 눈금
function gbar(total, t1, t2, kind) {
  var max = t2 > 0 ? t2 : t1;
  if (!(max > 0)) return '';
  var pct = Math.max(0, Math.min(100, total / max * 100));
  var cls = '';
  if (kind === 'limit') cls = total >= t1 * 0.8 ? 'l2' : '';
  else cls = (t2 > 0 && total >= t2) ? 'l2' : (total >= t1 ? 'l1' : '');
  var h = '<div class="gbar"><i class="' + cls + '" style="width:' + pct + '%"></i>';
  if (kind === 'limit') h += '<span class="tk" style="left:80%"></span><span class="tl" style="left:80%">80%</span>';
  else if (t2 > 0 && t1 > 0) h += '<span class="tk" style="left:' + (t1 / max * 100) + '%"></span><span class="tl" style="left:' + (t1 / max * 100) + '%">' + man(t1) + '</span>';
  return h + '<span class="tl end">' + man(max) + '</span></div>';
}

function benefitHTML(c) {
  if (!c.benefit1 && !c.benefit2) return '';
  function blk(title, txt, on) {
    return '<div class="bn' + (on ? ' on' : '') + '"><b>' + title + (on ? ' · 이번 기간 적용 중' : '') + '</b><div class="sub">' + nl2br(txt) + '</div></div>';

/* 카드 순서 바꾸기: ☰를 길게 누르고 위아래로 끈다 */
var DRAG = null;
document.addEventListener('selectstart', function (e) { if (DRAG) e.preventDefault(); });
function gripDown(e, id) {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  var card = e.currentTarget.closest('.ccard');
  if (!card || DRAG) return;
  e.preventDefault();
  DRAG = { id: id, card: card, grip: e.currentTarget, pid: e.pointerId, x0: e.clientX, y0: e.clientY, py: e.clientY, pageY0: e.clientY + window.scrollY, on: false, target: -1 };
  try { e.currentTarget.setPointerCapture(e.pointerId); } catch (x) {}
  DRAG.timer = setTimeout(dragStart, 330);
}
function dragStart() {
  var d = DRAG; if (!d) return;
  var list = d.card.parentNode, els = Array.prototype.slice.call(list.querySelectorAll('.ccard'));
  d.els = els; d.i = els.indexOf(d.card);
  d.tops = els.map(function (el) { return el.getBoundingClientRect().top + window.scrollY; });
  d.hs = els.map(function (el) { return el.getBoundingClientRect().height; });
  d.mids = els.map(function (el, k) { return d.tops[k] + d.hs[k] / 2; });
  d.gap = els.length > 1 ? Math.max(0, d.tops[1] - (d.tops[0] + d.hs[0])) : 10;
  d.on = true; d.target = d.i;
  try { var sel = window.getSelection(); if (sel) sel.removeAllRanges(); } catch (x) {}
  d.card.classList.add('lift');
  els.forEach(function (el) { if (el !== d.card) el.style.transition = 'transform .15s'; });
  document.body.classList.add('dragging');
  if (navigator.vibrate) { try { navigator.vibrate(15); } catch (x) {} }
  dragLoop();
}
function dragLoop() {
  var d = DRAG; if (!d || !d.on) return;
  if (d.py < 70) window.scrollBy(0, -12); else if (d.py > window.innerHeight - 90) window.scrollBy(0, 12);
  dragUpdate();
  d.raf = requestAnimationFrame(dragLoop);
}
function dragUpdate() {
  var d = DRAG; if (!d || !d.on) return;
  var dy = d.py + window.scrollY - d.pageY0, center = d.mids[d.i] + dy, up = 0, down = 0, sh = d.hs[d.i] + d.gap;
  d.card.style.transform = 'translateY(' + dy + 'px)';
  d.els.forEach(function (el, k) {
    if (k === d.i) return;
    var t = 0;
    if (k < d.i && d.mids[k] > center) { t = sh; down++; }
    else if (k > d.i && d.mids[k] < center) { t = -sh; up++; }
    el.style.transform = t ? 'translateY(' + t + 'px)' : '';
  });
  d.target = d.i - down + up;
}
function gripMove(e) {
  var d = DRAG; if (!d || e.pointerId !== d.pid) return;
  d.py = e.clientY;

(function () {
  var hs = location.hash || '', mu = hs.match(/[#&]u=([^&]+)/);
  if (mu) { API_URL = decodeURIComponent(mu[1]); try { localStorage.setItem('sjc_api', API_URL); } catch (e) {} }
  if (hs) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} } // 주소창에 남은 옛 토큰 제거
  var mi = hs.match(/[#&]i=([^&]+)/);
  if (mi && IS_MOBILE) { useInvite(decodeURIComponent(mi[1])); return; }
  load();
})();
</script>
